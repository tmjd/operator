version: v1.0
name: Release pipeline

execution_time_limit:
  hours: 2

agent:
  machine:
    type: e1-standard-4
    os_image: ubuntu1804

global_job_config:
  secrets:
  - name: docker-hub
  # Mount the github SSH secret for pulling private repositories.
  - name: private-repo
  prologue:
    commands:
    - echo $DOCKERHUB_PASSWORD | docker login --username "$DOCKERHUB_USERNAME" --password-stdin
    # Correct permissions since they are too open by default:
    - chmod 0600 ~/.keys/*
    # Add the key to the ssh agent:
    - ssh-add ~/.keys/*
    # Free up some space
    - sudo rm -rf ~/.kiex ~/.phpbrew ~/.rbenv ~/.nvm ~/.kerl
    # Semaphore mounts a copy-on-write FS as /var/lib/docker in order to provide a pre-loaded cache of
    # some images. However, the cache is not useful to us and the copy-on-write FS is a big problem given
    # how much we churn docker containers during testing.  Disable it.
    - sudo systemctl stop docker
    - sudo umount /var/lib/docker && sudo killall qemu-nbd || true
    - sudo systemctl start docker
    - checkout
    - 'cache restore go-pkg-cache'
    - 'cache restore go-mod-cache'

blocks:
  - name: 'Build and Push amd64 Image on tag'
    execution_time_limit:
      minutes: 45
    run:
      # Only run on tags.
      when: "tag =~ '.*'"
    task:
      jobs:
        - name: Build and push amd64 images
          execution_time_limit:
            minutes: 45
          commands:
            - export ARCH=amd64
            - make images CONFIRM=true
            - make dirty-check
            - make tag-push-image IMAGETAG=$SEMAPHORE_GIT_TAG_NAME CONFIRM=true
      secrets:
        - name: quay-robot-semaphore_v2
      prologue:
        commands:
          - docker login -u="$QUAY_USERNAME" -p="$QUAY_TOKEN" quay.io;

  - name: 'Build and Push arm64 Image on tag'
    execution_time_limit:
      minutes: 45
    run:
      # Only run on tags.
      when: "tag =~ '.*'"
    task:
      jobs:
        - name: Build and push arm64 images
          execution_time_limit:
            minutes: 45
          commands:
            - export ARCH=arm64
            - make images CONFIRM=true
            - make dirty-check
            - make tag-push-image IMAGETAG=$SEMAPHORE_GIT_TAG_NAME CONFIRM=true
      secrets:
        - name: quay-robot-semaphore_v2
      prologue:
        commands:
          - docker login -u="$QUAY_USERNAME" -p="$QUAY_TOKEN" quay.io

  - name: Push multi-arch manifests
    dependencies: ["Build and Push amd64 Image on tag", "Build and Push arm64 Image on tag"]
    run:
      # Only run on tags.
      when: "tag =~ '.*'"
    task:
      jobs:
        - name: Push multi-arch manifests
          commands:
            - make push-manifests IMAGETAG=$SEMAPHORE_GIT_TAG_NAME
      secrets:
        - name: quay-robot-semaphore_v2
      prologue:
        commands:
          - docker login -u="$QUAY_USERNAME" -p="$QUAY_TOKEN" quay.io


