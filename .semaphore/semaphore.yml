version: v1.0
name: Initial Pipeline

execution_time_limit:
  hours: 4

agent:
  machine:
    type: e1-standard-2
    os_image: ubuntu1804

global_job_config:
  secrets:
  - name: docker-hub
  # Mount the github SSH secret for pulling private repositories.
  - name: private-repo
  prologue:
    commands:
    - echo $DOCKERHUB_PASSWORD | docker login --username "$DOCKERHUB_USERNAME" --password-stdin
    # Correct permissions since they are too open by default:
    - chmod 0600 ~/.keys/*
    # Add the key to the ssh agent:
    - ssh-add ~/.keys/*
    # Free up some space
    - sudo rm -rf ~/.kiex ~/.phpbrew ~/.rbenv ~/.nvm ~/.kerl
    # Semaphore mounts a copy-on-write FS as /var/lib/docker in order to provide a pre-loaded cache of
    # some images. However, the cache is not useful to us and the copy-on-write FS is a big problem given
    # how much we churn docker containers during testing.  Disable it.
    - sudo systemctl stop docker
    - sudo umount /var/lib/docker && sudo killall qemu-nbd || true
    - sudo systemctl start docker
    - checkout
    # Note that the 'cache restore' commands require that the "Build" block has been run. The "Build" block is what populates
    # the cache, therefore every block that requires the use of these cached items must make the "Build" block one of
    # it's dependencies.
    - 'cache restore go-pkg-cache-${SEMAPHORE_GIT_SHA}'
    - 'cache restore go-mod-cache-${SEMAPHORE_GIT_SHA}'
    - 'cache restore bin-${SEMAPHORE_GIT_SHA}'

blocks:
  - name: 'Build'
    dependencies: []
    task:
      prologue:
        commands:
          - cache restore go-pkg-cache
          - cache restore go-mod-cache
      jobs:
        - name: Build
          execution_time_limit:
            minutes: 45
          commands:
            - make build
            - make dirty-check
            # Store in cache for other builds in this run
            - 'cache store bin-${SEMAPHORE_GIT_SHA} build/_output/bin'
            - 'cache store go-pkg-cache-${SEMAPHORE_GIT_SHA} .go-pkg-cache'
            - 'cache store go-mod-cache-${SEMAPHORE_GIT_SHA} ${HOME}/go/pkg/mod/cache'
            # Store in cache for subsequent runs
            - cache store go-pkg-cache .go-pkg-cache
            - 'cache store go-mod-cache ${HOME}/go/pkg/mod/cache'

  - name: 'Static Checks'
    dependencies: ["Build"]
    task:
      jobs:
        - name: Static Checks
          execution_time_limit:
            minutes: 15
          commands:
            - make static-checks

  - name: 'Check generated files'
    dependencies: ["Build"]
    task:
      jobs:
        - name: Check generated files
          execution_time_limit:
            minutes: 15
          commands:
            # validate-gen-versions includes dirty-check
            # Temporarily skip this after monorepo updates
            #- make validate-gen-versions
            - make test-crds

  - name: 'UT'
    dependencies: ["Build"]
    task:
      jobs:
        - name: Run UTs
          execution_time_limit:
            minutes: 25
          commands:
            - make ut
            - make dirty-check

  - name: 'FV'
    dependencies: ["Build"]
    task:
      agent:
        machine:
          type: e1-standard-4
          os_image: ubuntu1804
      jobs:
        - name: Run FVs
          execution_time_limit:
            minutes: 30
          commands:
            - make fv
            - make dirty-check

  - name: 'Build and Push amd64 Image (non-PR builds only)'
    execution_time_limit:
      minutes: 45
    dependencies: ["Static Checks", "Check generated files", "UT", "FV"]
    skip:
      # Do not run on PRs.
      when: "pull_request =~ '.*'"
    task:
      jobs:
        - name: Build push branch images
          execution_time_limit:
            minutes: 45
          commands:
            - export BRANCH_NAME=$SEMAPHORE_GIT_BRANCH
            - export ARCH=amd64
            - make images CONFIRM=true
            - make dirty-check
            - make tag-push-image IMAGETAG=$BRANCH_NAME CONFIRM=true
      secrets:
        - name: quay-robot-semaphore_v2
      prologue:
        commands:
          - docker login -u="$QUAY_USERNAME" -p="$QUAY_TOKEN" quay.io;

  - name: 'Build and Push arm64 Image (non-PR builds only)'
    execution_time_limit:
      minutes: 45
    dependencies: ["Static Checks", "Check generated files", "UT", "FV"]
    skip:
      # Do not run PRs.
      when: "pull_request =~ '.*'"
    task:
      jobs:
        - name: Build and push arm64 images on branch
          execution_time_limit:
            minutes: 45
          commands:
            - export BRANCH_NAME=$SEMAPHORE_GIT_BRANCH
            - export ARCH=arm64
            - make images CONFIRM=true
            - make dirty-check
            - make tag-push-image IMAGETAG=$BRANCH_NAME CONFIRM=true
      secrets:
        - name: quay-robot-semaphore_v2
      prologue:
        commands:
          - docker login -u="$QUAY_USERNAME" -p="$QUAY_TOKEN" quay.io

  - name: Push multi-arch manifests
    dependencies: ["Build and Push amd64 Image (non-PR builds only)", "Build and Push arm64 Image (non-PR builds only)"]
    skip:
      # Do not run PRs.
      when: "pull_request =~ '.*'"
    task:
      jobs:
        - name: Push multi-arch manifests
          commands:
            - export BRANCH_NAME=$SEMAPHORE_GIT_BRANCH
            - make push-manifests IMAGETAG=$BRANCH_NAME
      secrets:
        - name: quay-robot-semaphore_v2
      prologue:
        commands:
          - docker login -u="$QUAY_USERNAME" -p="$QUAY_TOKEN" quay.io
      epilogue:
        on_pass:
          commands:
            - cache store go-pkg-cache .go-pkg-cache
            - 'cache store go-mod-cache ${HOME}/go/pkg/mod/cache'


promotions:
  # Run this manually via the semaphore UI if the cache is full
  - name: Clear Cache
    pipeline_file: clear_cache.yml
  - name: Release operator
    pipeline_file: release.yml
    auto_promote:
      # If the block has passed and the branch is for master or a release branch and on a tag then release.
      when: "(result = 'passed') and ((branch = 'master') or (branch =~ '^release-v\d*\.\d*')) and (tag =~ '^v\d*\.\d*\.\d"
